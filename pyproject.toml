[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx-dataforge"
version = "0.1.0"
description = "V0 dataset builder for Cognityx paragraph-baseline training data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Cognityx" }]
dependencies = [
  "cognityx-resource",
  "cognityx-storage",
  "cognityx-jobs",
  "cognityx-ingest",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9.5", "mkdocstrings-python>=1.12"]
inference = ["cognityx-inference"]

[project.scripts]
cognityx-dataforge = "cognityx_dataforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_dataforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
cognityx-resource = { git = "https://github.com/cognityx/cognityx-resource.git" }
cognityx-storage = { git = "https://github.com/cognityx/cognityx-storage.git" }
cognityx-jobs = { git = "https://github.com/cognityx/cognityx-jobs.git" }
cognityx-ingest = { git = "https://github.com/cognityx/cognityx-ingest.git" }
cognityx-inference = { git = "https://github.com/cognityx/cognityx-inference.git", rev = "06786245415844ca1587d765c14e42dc40b72460" }

[tool.uv]
override-dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@79f89a965f46300be6a892d4371d44e6c288fd0c",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@0d159136ebac6ce5362a5092ea4d6d2f181e9c89",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@bfd10769703dfca97e6a70b0d242c5ccd961d702",
]
