[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx-dataforge"
version = "0.1.0"
description = "V0 dataset builder for Cognityx paragraph-baseline training data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Cognityx" }]
dependencies = [
  "cognityx-resource",
  "cognityx-storage",
  "cognityx-jobs",
  "cognityx-ingest",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9.5", "mkdocstrings-python>=1.12"]
inference = ["cognityx-inference"]

[project.scripts]
cognityx-dataforge = "cognityx_dataforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_dataforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
cognityx-resource = { git = "https://github.com/cognityx/cognityx-resource.git", rev = "b23220b69fcb182e681cf13276c37474666c9bd2" }
cognityx-storage = { git = "https://github.com/cognityx/cognityx-storage.git", rev = "0e73a286ff3c070f5e3fb30df7f00eab08b5c02c" }
cognityx-jobs = { git = "https://github.com/cognityx/cognityx-jobs.git", rev = "e4312fd461df97ffcefc54352b9b76f1dd6e6860" }
cognityx-ingest = { git = "https://github.com/cognityx/cognityx-ingest.git", rev = "84de6039cfb087a14db40a7b84f29eeba4557f75" }
cognityx-inference = { git = "https://github.com/cognityx/cognityx-inference.git", rev = "14710786f5466d28c0e5690f4acf75e72f6d4e1d" }

[tool.uv]
override-dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@b23220b69fcb182e681cf13276c37474666c9bd2",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@0e73a286ff3c070f5e3fb30df7f00eab08b5c02c",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@e4312fd461df97ffcefc54352b9b76f1dd6e6860",
]
